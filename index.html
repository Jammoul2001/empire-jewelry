<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empire Jewelry has moved</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://empire-jewelry.github.io/">
  <script>
    // Alte Adresse jammoul2001.github.io/empire-jewelry/… → neue Adresse.
    // Unterseite (z. B. /ar/), Entwurfs-Link (?d=…) und Sprungmarke (#name) bleiben erhalten.
    (function () {
      var p = location.pathname.replace(/^\/empire-jewelry/i, '') || '/';
      location.replace('https://empire-jewelry.github.io' + p + location.search + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=https://empire-jewelry.github.io/"></noscript>
</head>
<body>
  <p>Empire Jewelry has moved: <a href="https://empire-jewelry.github.io/">empire-jewelry.github.io</a></p>
  <p lang="ar" dir="rtl">انتقل موقع Empire Jewelry إلى: <a href="https://empire-jewelry.github.io/ar/">empire-jewelry.github.io</a></p>
</body>
</html>
